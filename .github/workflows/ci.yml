name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Supabase CLI
        run: npm run supabase:version

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Verify local Supabase status
        run: npm run supabase:status

      - name: Rebuild local database from migrations
        run: npm run supabase:reset

      - name: Lint local database
        run: npm run supabase:lint

      - name: Test local database
        run: npm run supabase:test

      - name: Verify generated database types
        shell: bash
        run: |
          npm run supabase:types
          git diff --exit-code -- lib/supabase/database.types.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
